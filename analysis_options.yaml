# Konfigurasi analyzer Dart.
#
# Aturan dasar berasal dari `package:flutter_lints/flutter.yaml`. Daftar di bawah
# menambahkan aturan yang relevan untuk aplikasi ini: banyak provider Riverpod,
# banyak Future tanpa await (I/O Hive dan dio), dan banyak Context setelah await.

include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # `unawaited_futures` catchingkan pemanggilan Future yang sengaja dibiarkan
    # (mis. `ref.invalidate(...)`), jadi bukan error.
    unawaited_futures: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # C4: aturan tambahan.
    - avoid_print
    - use_build_context_synchronously
    - unawaited_futures
    - prefer_const_constructors
    - prefer_final_locals
    - directives_ordering
    - always_declare_return_types
